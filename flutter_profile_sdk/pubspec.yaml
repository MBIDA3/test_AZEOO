name: flutter_profile_sdk
description: SDK Flutter pour afficher un profil utilisateur
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.0
  
  # Navigation
  go_router: ^12.0.0
  
  # API
  dio: ^5.4.0
  
  # Sérialisation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # Cache
  flutter_cache_manager: ^3.3.1
  
  # Images
  cached_network_image: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code generation
  build_runner: ^2.4.6
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
