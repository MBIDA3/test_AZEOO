name: flutter_module
description: "SDK Flutter AZEOO - Affichage profil utilisateur"
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  
  # Navigation
  go_router: ^12.0.0
  
  # API
  dio: ^5.4.0
  
  # Sérialisation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  
  # Cache
  flutter_cache_manager: ^3.3.1
  
  # Images
  cached_network_image: ^3.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code generation
  build_runner: ^2.4.6
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Configuration du module Flutter pour intégration React Native
  module:
    androidX: true
    androidPackage: com.azeoo.flutter_module
    iosBundleIdentifier: com.azeoo.flutterModule
